[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    ; Use the StopWatch startup sequence even before touch responds on a cold boot.
    -DBOARD_ID=30
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/m5stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313
    https://github.com/m5stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
    https://github.com/m5stack/M5PM1.git#315d2899c863ae34b59197392b9f4c59490751ef
    https://github.com/m5stack/M5IOE1.git#8401119bf171cb8f906fbe22e7490989077bbee8
